server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: unbekannte Pfade an index.html weiterreichen (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Requests intern an den Backend-Container weiterleiten.
    # Der trailing slash in proxy_pass sorgt dafür, dass das /api-Prefix
    # entfernt wird, bevor der Request beim Backend ankommt:
    #   https://domain/api/items  ->  proxy_pass http://backend:4000/  ->  Backend sieht /items
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth-Cookies (token/refreshToken) werden vom Backend mit Pfad /auth
        # bzw. / gesetzt; proxy_cookie_path sorgt dafür, dass sie unter dem
        # tatsächlichen Frontend-Pfad ankommen.
        proxy_cookie_path / /;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
